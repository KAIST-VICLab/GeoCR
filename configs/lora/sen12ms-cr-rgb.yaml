# CR_DATASETS=<data> CR_EXPORTS=<exports> python -m geocr.train configs/lora/sen12ms-cr-rgb.yaml
name: finetune_sen12mscr_rgb_lora
data:
  source: sen12mscr_rgb
  root: ${oc.env:CR_DATASETS,CR_datasets}/SEN12MS-CR
  train_split: trainval
  resolution: 256
  k_choices: [1]
  k_probs: [1.0]
  s1_drop: 1.0
model:
  ae_path: weights/vae/ae.safetensors
  ms_enabled: false
  lora_rank: 16
  lora_alpha: 16.0
flow:
  time_scheme: logit_normal
  shift: 1.36
loss:
  ms_weight: 0.0
train:
  seed: 2026
  output_dir: runs/lora/sen12ms-cr-rgb
  init_from: weights/transformer
  steps: 50000
  batch_size: 8
  grad_accum: 4
  lr: 1.0e-4
  warmup_steps: 2000
  ckpt_keep: 2
