# CR_DATASETS=<data> python -m geocr.train configs/lora/sen12ms-cr.yaml
name: finetune_sen12mscr_lora
data:
  source: sen12mscr
  root: ${oc.env:CR_DATASETS,CR_datasets}/SEN12MS-CR
  train_split: trainval
  resolution: 256
  k_choices: [1]
  k_probs: [1.0]
  s1_drop: 0.1
model:
  ae_path: weights/vae/ae.safetensors
  stems_path: weights/stems/stems.safetensors
  ms_enabled: true
  ms_stems: ["10", "10b", "1"]
  lora_rank: 16
  lora_alpha: 16.0
flow:
  time_scheme: logit_normal
  shift: 1.36
loss:
  ms_weight: 1.0
train:
  seed: 2026
  output_dir: runs/lora/sen12ms-cr
  init_from: weights/transformer
  steps: 50000
  batch_size: 8
  grad_accum: 4
  lr: 1.0e-4
  warmup_steps: 2000
  ckpt_keep: 2
