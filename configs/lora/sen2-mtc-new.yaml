# CR_DATASETS=<data> python -m geocr.train configs/lora/sen2-mtc-new.yaml
name: finetune_sen2mtc_new_lora
data:
  source: sen2mtc_new
  root: ${oc.env:CR_DATASETS,CR_datasets}/Sen2_MTC_New
  train_split: trainval
  resolution: 256
  k_choices: [3]
  k_probs: [1.0]
  s1_drop: 1.0
model:
  ae_path: weights/vae/ae.safetensors
  stems_path: weights/stems/stems.safetensors
  ms_enabled: true
  ms_stems: ["10", "10b", "1"]
  lora_rank: 16
  lora_alpha: 16.0
flow:
  time_scheme: logit_normal
  shift: 1.36
loss:
  ms_weight: 1.0
train:
  seed: 2026
  output_dir: runs/lora/sen2-mtc-new
  init_from: weights/transformer
  steps: 20000
  batch_size: 8
  grad_accum: 4
  lr: 1.0e-4
  warmup_steps: 1000
  ckpt_keep: 2
