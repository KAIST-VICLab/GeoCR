model:
  base_learning_rate: 2.38e-04
  target: sgm.models.diffusion.TemporalResidualDiffusionEngine
  params:
    input_key: "gt_image"
    mean_key: "raw_image"
    image_path_key: "path"
    compile_model: False
    use_ema: True
    use_flash_attn2: False
    dump_dir: "${oc.env:EMRDM_DUMP_ROOT,dumps}/sen2mtc_new/test/emrdm/${oc.env:EMRDM_RUN_ID,RUN_ID_UNSET}"
    dump_dtype: "float32"
    dump_channels: 4

    sigma_st_config:
      target: sgm.modules.diffusionmodules.sigma2st.EDMSigma2St
      params:
        alpha: 1.0

    denoiser_config:
      target: sgm.modules.diffusionmodules.denoiser.TemporalResidualDenoiser
      params:
        scaling_config:
          target: sgm.modules.diffusionmodules.denoiser_scaling.TemporalResidualEDMScaling
          params:
            sigma_input: 1.0
            sigma_mu: 1.0

    network_wrapper: "sgm.modules.diffusionmodules.wrappers.TemporalCloudRemovalWrapper"

    network_config:
      target: sgm.modules.diffusionmodules.k_diffusion.image_transformer.ImageTemporalTransformerDenoiserInterface
      params:
        in_channels: 7
        out_channels: 3
        patch_size: [4,4]
        widths: [256,512,768]
        depths: [2,2,16]
        d_ffs: [512,1024,1536]
        self_attns: [
            {"type": "neighborhood", "d_head": 64, "kernel_size": 7},
            {"type": "neighborhood", "d_head": 64, "kernel_size": 7},
            {"type": "global", "d_head": 64},
        ]
        dropout_rate: [0.0,0.0,0.0]
        mapping_depth: 2
        mapping_width: 768
        mapping_d_ff: 1536
        mapping_dropout_rate: 0.1
        temporal_n_heads: 16
        temporal_d_model: 768
        temporal_d_k: 48
        temporal_positional_encoding: False
        temporal_agg_mode: "att_group"
        temporal_dropout: 0.0
        temporal_use_drouput: False
        temporal_mlp: [768, 1536]
        pad_value: 0
        tanh: False

    conditioner_config:
      target: sgm.modules.GeneralConditioner
      params:
        emb_models:
          - is_trainable: True
            input_key: "cond_image"
            ucg_rate: 0.0
            target: sgm.modules.encoders.modules.IndentityEmbedder

    first_stage_config:
      target: sgm.models.autoencoder.IdentityFirstStage

    loss_fn_config:
      target: sgm.modules.diffusionmodules.loss.TemporalResidualDiffusionLoss
      params:
        loss_weighting_config:
          target: sgm.modules.diffusionmodules.loss_weighting.TemporalResidualEDMWeighting
          params:
            sigma_input: 1.0
            sigma_mu: 1.0
        sigma_sampler_config:
          target: sgm.modules.diffusionmodules.sigma_sampling.EDMSampling
          params:
            p_mean: -1.4
            p_std: 1.4

    sampler_config:
      target: sgm.modules.diffusionmodules.sampling.TemporalResidualEulerEDMSampler
      params:
        num_steps: 5

        discretization_config:
          target: sgm.modules.diffusionmodules.discretizer.EDMDiscretization
          params:
            sigma_min: 0.001
            sigma_max: 100.0

    to_rgb_config:
      target: sgm.util.S1andS2_to_rgb
    scale_01_config:
      target: sgm.util.sen_mtc_scale_01

data:
  target: sgm.data.base.DataModuleFromConfig
  params:
    batch_size: 32
    num_workers: 8
    wrap: True
    train:
      target: geocr_bench.datasets_mtc.Sen2MTCNewSplitDataset
      params:
        root: "${oc.env:CR_DATASETS}/Sen2_MTC_New"
        split: "train"
        split_file: "${oc.env:CR_DATASETS}/Sen2_MTC_New/splits/trainval.txt"
        splits_dir: "splits"
        use_ir: True
        multi_temporal: 3
    test:
      target: geocr_bench.datasets_mtc.Sen2MTCNewSplitDataset
      params:
        root: "${oc.env:CR_DATASETS}/Sen2_MTC_New"
        split: "test"
        splits_dir: "splits"
        use_ir: True
        multi_temporal: 3
    predict:
      target: geocr_bench.datasets_mtc.Sen2MTCNewSplitDataset
      params:
        root: "${oc.env:CR_DATASETS}/Sen2_MTC_New"
        split: "test"
        splits_dir: "splits"
        use_ir: True
        multi_temporal: 3

lightning:
  modelcheckpoint:
    params:
      monitor: null
      save_top_k: 0
      save_last: True
      every_n_train_steps: 1000

  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        disabled: True

  trainer:
    devices: "0,"
    num_sanity_val_steps: 0
    benchmark: True
    accumulate_grad_batches: 1
    max_steps: 20000
    max_epochs: -1
